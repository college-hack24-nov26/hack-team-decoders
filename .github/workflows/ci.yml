name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: lint (ruff + black) + test (pytest)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Run tests
        run: pytest --tb=short

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: lint (eslint) + format check (prettier) + test (vitest)
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with eslint
        run: npm run lint

      - name: Check formatting with prettier
        run: npm run format:check

      - name: Run tests
        run: npm test

      # Added in Phase 2. The build was broken by a type error in vite.config.ts
      # from Phase 0 and nothing noticed, because lint/format/test all pass
      # without ever compiling the app for production.
      - name: Build
        run: npm run build
