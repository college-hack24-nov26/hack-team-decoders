server {
    listen 80;
    index index.html;

    # Gzip compression for CSS/JS
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml video/mp4;
    gzip_min_length 256;

    # ── React SPA (kiosk + doctor dashboard) ─────────────────────────────────
    # Cache hashed assets aggressively (Vite includes content hash in filenames)
    location /kiosk/assets/ {
        alias /usr/share/nginx/html/kiosk/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: all /kiosk/* routes fall back to /kiosk/index.html
    location /kiosk/ {
        alias /usr/share/nginx/html/kiosk/;
        try_files $uri $uri/ /kiosk/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Proxy API calls to the backend ───────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }

    # ── Landing page (root) ──────────────────────────────────────────────────
    # Catch-all: landing page files (index.html, styles.css, logo.svg, video)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
